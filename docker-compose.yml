services:
  db:
    image: postgres:16
    # Values come from db/dev.env: `docker compose --env-file db/dev.env`.
    environment:
      POSTGRES_USER: ${POS_OWNER_USER:?set by db/dev.env}
      POSTGRES_PASSWORD: ${POS_OWNER_PASSWORD:?set by db/dev.env}
      POSTGRES_DB: ${POS_DB_NAME:?set by db/dev.env}
    # Bound to loopback only. ARCHITECTURE.md §3.1: PostgreSQL is reachable
    # only from the same host, never from the LAN. A bare "5433:5432" would
    # publish on every interface.
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  pgdata:
