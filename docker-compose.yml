services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pos_owner
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: pos
    # Bound to loopback only. ARCHITECTURE.md §3.1: PostgreSQL is reachable
    # only from the same host, never from the LAN. A bare "5433:5432" would
    # publish on every interface.
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_owner -d pos"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  pgdata:
