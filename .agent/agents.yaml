# Agent kit presets: role -> CLI, model, effort, mode, owned paths; category ->
# role routing; limits. Read by .agent/bin/dispatch.sh (KIT-004), ask.sh and the
# pre-commit guard (KIT-003). Model ids and flags were checked against the
# installed CLIs on 2026-09-29: see .agent/journal/2026-09-29-kit-phase0.md.
# Owner decisions behind this file: .agent/DECISIONS.md (2026-09-29 lines).
version: 1
verify: npm run verify            # the one command that must be green
integration_branch: development   # agent branches start here; PRs target it
protected_branches: [main, development]

limits:
  max_builders: 1                 # plus the designer alongside
  max_fix_cycles: 2
  max_turns: 200                  # Claude only (--max-turns). Codex and OpenCode have no turn cap.
  stall_alert_min: 20             # awake time with no log/file change -> notify, never kill. The only runaway guard for Codex/OpenCode.

families: { claude: anthropic, codex: openai, opencode: openai }
base_skills: [herdr]              # every role, every CLI
# roles.<role>.skills is a hint, not a gate (owner, 2026-09-29): every CLI loads
# every installed skill, and no launch applies launch.<cli>.skills_gate. .agent/bin/skills-report.sh
# compares the two; `--gate <role> <cli>` prints the per-run arguments that
# limit a run to the role's skills (each CLI checked 2026-09-29, tasks/KIT-002a).
# MCP servers a role may use only when roles.<role>.mcps lists them. Every
# launch turns each one on or off per run (launch.<cli>.mcp_on / mcp_off,
# proven 2026-09-29 in tasks/KIT-002a); no global config is edited. ~/.codex/config.toml enables context7 for every
# Codex run and stays that way (owner, 2026-09-29), so a launch without the
# mcp_off flag, such as an interactive designer, can still reach it.
gated_mcps: [context7]

# How each CLI is launched one-shot. {model}, {role_prompt_file}, {prompt},
# {session} and {effort} are filled by dispatch.sh. Verified against --help, 2026-09-29.
launch:
  claude:
    oneshot: claude -p --model {model} --append-system-prompt-file {role_prompt_file} --output-format json --max-turns {max_turns}
    # permission mode for unattended builders (they need Bash for verify and git) is chosen in KIT-004
    resume: claude -p --resume {session} --output-format json
    effort: --effort {effort}
    caveman_off: --settings '{"enabledPlugins":{"caveman@caveman":false}}'   # per process; never CAVEMAN_DEFAULT_MODE=off (deletes the lead's shared flag)
    read_only: --permission-mode plan
    skills_gate: --settings from `skills-report.sh --gate {role} claude`   # skillOverrides + enabledPlugins; merge with caveman_off into ONE --settings object; plugin skills go only with their whole plugin
    mcp_off:                      # per run, by gated MCP; the plugin stays installed for the fallback librarian
      context7: --disallowedTools mcp__plugin_context7_context7 mcp__claude_ai_Context7   # the plugin and the claude.ai connector
    session_id_from: .session_id                                            # json result field
  codex:
    oneshot: codex exec -m {model} --sandbox workspace-write --json   # prompt text = role prompt, blank line, task prompt (no system-prompt flag)
    resume: codex exec resume {session}
    effort: -c model_reasoning_effort={effort}
    read_only: --sandbox read-only
    mcp_on:                       # per run, by gated MCP; ask.sh applies mcp_on and mcp_off
      context7: -c mcp_servers.context7.enabled=true
    mcp_off:                      # both routes: the config server and the ChatGPT apps connector "Context7"
      context7: -c mcp_servers.context7.enabled=false -c apps.asdk_app_69ef18c674308191a2f952431f91ea61.enabled=false
    web_search: --search          # top-level codex flag; placement checked by ask.sh
    skills_gate: -c from `skills-report.sh --gate {role} codex`    # skills.config=[{path,enabled=false}] per unassigned skill
    stdin: /dev/null              # otherwise codex waits on "Reading additional input from stdin"
    role_prompt: prepend
  opencode:
    oneshot: opencode run --model {model} --format json   # prompt text = role prompt, blank line, task prompt
    resume: opencode run --session {session}
    effort: --variant {effort}
    skills_gate: env from `skills-report.sh --gate {role} opencode`   # OPENCODE_CONFIG_CONTENT permission.skill allowlist
    read_only: none               # `--agent plan` hung >5 min in `opencode run` (2026-09-29); no read-only role runs here
    role_prompt: prepend
  herdr:
    open_pane: herdr pane split --current --direction right --cwd {worktree} --no-focus   # no --name flag
    name_pane: herdr pane rename {pane} {task_id}

roles:
  lead:
    default: { cli: claude, model: claude-opus-5-5 }
    mode: interactive
    skills: [dispatch]
    caveman: chat                 # chat and status pings only; never in files
    owns:
      - .agent/STATE.md
      - .agent/QUEUE.md
      - .agent/DECISIONS.md
      - .agent/LESSONS.md
      - .agent/journal/**
      - .agent/tasks/**           # all but each task's Handoff section
      - .agent/agents.yaml
      - .agent/roles/**
      - .agent/bin/**
      - .agent/WORKFLOW.md
      - .claude/**
      - .githooks/**
      - AGENTS.md
      - CLAUDE.md
      - .caveman.json
  architect:
    default: { cli: claude, model: claude-opus-5-5 }
    mode: interactive
    skills: [grill-me]
    caveman: off
    owns: [docs/ARCHITECTURE*.md, docs/decisions/**]
  designer:
    default: { cli: codex, model: gpt-6-astra, effort: high }
    mode: interactive
    skills: [impeccable]
    caveman: off
    owns: [docs/design/**, docs/DESIGN.md]
    verify: none                  # set to npm run verify when assigned tokens/CSS
  builder:
    default: { cli: claude, model: claude-sonnet-5-5 }
    profiles:
      economy: { cli: opencode, model: openai/gpt-6-luna, account: openai-b }
      heavy:   { cli: opencode, model: openai/gpt-6-sol,  account: openai-b }
    fallback: economy             # used automatically on a quota/rate-limit exit
    mode: oneshot
    caveman: chat
    owns:
      - apps/**
      - packages/**
      - db/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - docker-compose.yml
      # plus the Handoff section of its own .agent/tasks/<ID>.md
  reviewer:
    mode: oneshot
    caveman: off
    owns: [.agent/reviews/**]
    pick:                         # by the builder's family x review strength (cross-family rule)
      openai:    { light: { cli: claude, model: claude-sonnet-5-5 }, strong: { cli: claude, model: claude-opus-5-5 } }
      anthropic: { light: { cli: codex,  model: gpt-6-luna },        strong: { cli: codex,  model: gpt-6-astra, effort: high } }
  docs-writer:                    # only when a docs task is large enough to justify one
    default: { cli: claude, model: claude-sonnet-5-5 }
    mode: oneshot
    caveman: off
    owns: []                      # set per task
  explorer:
    runner: oneshot               # default; fallback: subagent (.claude/agents/explorer.md)
    oneshot:  { cli: codex, model: gpt-6-luna, sandbox: read-only }
    subagent: { model: haiku }
    owns: []
  librarian:
    runner: oneshot               # fallback: subagent (.claude/agents/librarian.md)
    oneshot:  { cli: codex, model: gpt-6-luna, sandbox: read-only, web: true }
    subagent: { model: sonnet }   # its tools list in .claude/agents/librarian.md grants the Context7 plugin
    mcps: [context7]              # the only role with MCPs, whichever CLI runs it
    owns: []

routing:
  quick:   { build: builder, review_strength: light }
  feature: { build: builder, review_strength: strong }
  ui:      { spec: designer, build: builder, review_strength: strong, review_extra: browser-walk }
  logic:   { build: architect, review_strength: strong }
  arch:    { build: architect, review_strength: strong, human_approval: true }
  docs:    { build: lead, review: none }

review:
  trivial_max_lines: 20           # at or under this, no touches flag, verify green -> the lead reviews

escalate_touches: [money, audit, identity, boundaries]

# Caveman is chat-only and never in files (every role). Roles set the default
# (roles.<role>.caveman). A task that matches either list below is launched
# with caveman off whatever its role, via launch.claude.caveman_off. Codex and
# OpenCode have no always-on caveman, so this only changes Claude launches.
# The lead's own chat follows CLAUDE.md ("When the lead writes plain prose").
caveman_off_when:
  categories: [arch, logic]
  touches: [money, audit, identity, boundaries]
contract_paths: [docs/PRODUCT.md, docs/PRD.md, docs/ROADMAP.md, docs/BOUNDARIES.md]
